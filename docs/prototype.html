<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHub — 本地 Session 云端接力平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#0b0e14; --bg2:#10141d; --bg3:#161b26; --bg4:#1d2330;
    --line:#232a3a; --line2:#2c3550;
    --tx:#e6e9f0; --tx2:#9aa4b8; --tx3:#5f6a80;
    --brand:#6d7cff; --brand2:#9a6dff; --grad:linear-gradient(135deg,#6d7cff,#9a6dff);
    --ok:#3ecf8e; --warn:#f5b04d; --err:#f0616d; --info:#58a6ff; --cyan:#39c5cf;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    font-size:14px; overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#2a3245;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Layout ---------- */
  .app{display:grid;grid-template-rows:56px 1fr;height:100vh}
  .main{display:grid;grid-template-columns:300px 1fr 360px;min-height:0}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:0 20px;
    border-bottom:1px solid var(--line);background:var(--bg2);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand .logo{
    width:30px;height:30px;border-radius:8px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
    box-shadow:0 2px 12px rgba(122,110,255,.45);
  }
  .brand small{font-weight:400;color:var(--tx3);font-size:12px;margin-left:2px}
  .topbar .nav{display:flex;gap:4px;margin-left:24px}
  .topbar .nav a{
    color:var(--tx2);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:13px;
    display:flex;align-items:center;gap:7px;
  }
  .topbar .nav a.active{color:var(--tx);background:var(--bg4)}
  .topbar .nav a:hover{color:var(--tx)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .conn{
    display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2);
    padding:5px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg3);
  }
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:13px;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);
    color:var(--tx2);cursor:pointer;font-size:13px;
  }
  .icon-btn:hover{color:var(--tx);border-color:var(--line2)}

  /* ---------- Sidebar ---------- */
  .sidebar{border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  .sidebar-head{padding:16px 16px 10px}
  .sidebar-head h2{font-size:13px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
  .sidebar-head h2 .count{
    margin-left:auto;background:var(--bg4);color:var(--tx2);font-size:11px;
    padding:1px 8px;border-radius:10px;font-weight:500;
  }
  .search{position:relative;margin:8px 16px 12px}
  .search i{position:absolute;left:11px;top:9px;color:var(--tx3);font-size:12px}
  .search input{
    width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
    padding:7px 10px 7px 30px;color:var(--tx);font-size:13px;outline:none;
  }
  .search input:focus{border-color:var(--brand)}
  .search input::placeholder{color:var(--tx3)}
  .filters{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
  .chip{
    font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
    color:var(--tx2);cursor:pointer;background:transparent;
  }
  .chip.active{background:rgba(109,124,255,.14);border-color:var(--brand);color:#aab4ff}
  .task-list{flex:1;overflow-y:auto;padding:0 10px 16px}
  .task-item{
    padding:12px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:6px;
  }
  .task-item:hover{background:var(--bg3)}
  .task-item.active{background:var(--bg3);border-color:var(--line2)}
  .task-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .task-item .repo{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .task-item .repo i{color:var(--tx3);font-size:12px}
  .task-item .summary{font-size:12px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
  .task-item .meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--tx3)}
  .task-item .meta i{margin-right:3px}
  .badge{
    font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;margin-left:auto;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .badge i{font-size:9px}
  .b-running{background:rgba(88,166,255,.13);color:var(--info)}
  .b-running i{animation:spin 1.4s linear infinite}
  .b-done{background:rgba(62,207,142,.12);color:var(--ok)}
  .b-queued{background:rgba(245,176,77,.12);color:var(--warn)}
  .b-failed{background:rgba(240,97,109,.12);color:var(--err)}
  .b-packaging{background:rgba(57,197,207,.12);color:var(--cyan)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
  .sidebar-foot code{font-family:var(--mono);color:var(--tx2);background:var(--bg3);padding:2px 6px;border-radius:5px;font-size:11px}

  /* ---------- Detail ---------- */
  .detail{overflow-y:auto;min-height:0;background:var(--bg)}
  .detail-inner{max-width:860px;margin:0 auto;padding:24px 28px 60px}
  .d-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
  .d-head .t-icon{
    width:42px;height:42px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--brand);flex-shrink:0;
  }
  .d-head h1{font-size:19px;font-weight:700;line-height:1.35}
  .d-head .sub{font-size:12.5px;color:var(--tx2);margin-top:5px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .d-head .sub i{color:var(--tx3);margin-right:4px}
  .d-head .sub code{font-family:var(--mono);font-size:11.5px;background:var(--bg3);padding:2px 7px;border-radius:5px;color:var(--tx2)}
  .d-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
  .btn{
    border:1px solid var(--line2);background:var(--bg3);color:var(--tx);border-radius:8px;
    padding:7px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--grad);border:none;color:#fff;font-weight:600}
  .btn.danger{color:var(--err)}
  .btn.danger:hover{border-color:var(--err)}

  /* stepper */
  .stepper{
    display:flex;align-items:center;margin:22px 0 26px;background:var(--bg2);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;overflow-x:auto;
  }
  .step{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:86px;position:relative}
  .step .ic{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;background:var(--bg4);color:var(--tx3);border:2px solid var(--line2);z-index:1;
  }
  .step.done .ic{background:rgba(62,207,142,.15);color:var(--ok);border-color:var(--ok)}
  .step.now .ic{background:rgba(88,166,255,.15);color:var(--info);border-color:var(--info);box-shadow:0 0 0 4px rgba(88,166,255,.12)}
  .step.now.st-done .ic{background:rgba(62,207,142,.15);color:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(62,207,142,.12)}
  .step.fail .ic{background:rgba(240,97,109,.15);color:var(--err);border-color:var(--err)}
  .step .lb{font-size:11px;color:var(--tx3);white-space:nowrap}
  .step.done .lb,.step.now .lb{color:var(--tx2)}
  .step .tm{font-size:10px;color:var(--tx3);font-family:var(--mono)}
  .step-line{flex:1;height:2px;background:var(--line2);min-width:24px;margin:0 4px 34px}
  .step-line.done{background:var(--ok)}

  /* cards */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .k{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
  .stat .v{font-size:19px;font-weight:700;font-family:var(--mono)}
  .stat .v small{font-size:12px;color:var(--tx2);font-weight:400}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
  .card-h{
    padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
    font-size:13px;font-weight:600;
  }
  .card-h i{color:var(--brand);font-size:13px}
  .card-h .hint{margin-left:auto;font-size:11px;color:var(--tx3);font-weight:400}
  .card-b{padding:16px 18px}

  /* commits */
  .commit{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .commit:last-child{border-bottom:none}
  .commit .hash{
    font-family:var(--mono);font-size:11.5px;color:var(--brand);background:rgba(109,124,255,.1);
    padding:3px 8px;border-radius:6px;flex-shrink:0;margin-top:1px;
  }
  .commit .msg{font-size:13px;line-height:1.5}
  .commit .files{font-size:11.5px;color:var(--tx3);margin-top:3px;font-family:var(--mono)}
  .commit .files .add{color:var(--ok)} .commit .files .del{color:var(--err)}
  .commit .who{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap;display:flex;align-items:center;gap:5px;margin-top:3px}

  /* logs */
  .logs{
    background:#080b11;font-family:var(--mono);font-size:12px;line-height:1.85;
    padding:14px 18px;max-height:320px;overflow-y:auto;
  }
  .log-line{display:flex;gap:12px;white-space:pre-wrap;word-break:break-all}
  .log-line .t{color:var(--tx3);flex-shrink:0}
  .log-line .tag{flex-shrink:0;width:52px}
  .tag.info{color:var(--info)} .tag.tool{color:var(--brand2)} .tag.git{color:var(--warn)}
  .tag.ok{color:var(--ok)} .tag.err{color:var(--err)} .tag.sys{color:var(--cyan)}
  .log-line .c{color:#b8c1d4}
  .cursor{display:inline-block;width:7px;height:13px;background:var(--info);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* pull guide */
  .pull-guide{background:linear-gradient(135deg,rgba(62,207,142,.07),rgba(109,124,255,.07));border:1px solid rgba(62,207,142,.3)}
  .pull-guide .card-h i{color:var(--ok)}
  .cmd{
    display:flex;align-items:center;gap:10px;background:#080b11;border:1px solid var(--line);
    border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:12.5px;margin-top:10px;
  }
  .cmd .dollar{color:var(--ok)}
  .cmd .copy{margin-left:auto;color:var(--tx3);cursor:pointer;font-size:12px}
  .cmd .copy:hover{color:var(--tx)}
  .merge-note{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
  .merge-note .mi{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
  .merge-note .mi i{color:var(--ok);font-size:12px}

  /* session merge visual */
  .timeline-merge{padding:6px 0}
  .tl-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
  .tl-row .src{
    width:64px;flex-shrink:0;font-size:10.5px;text-align:center;padding:2px 0;border-radius:5px;font-weight:600;
  }
  .src.local{background:rgba(109,124,255,.12);color:#aab4ff}
  .src.cloud{background:rgba(57,197,207,.12);color:var(--cyan)}
  .src.marker{background:rgba(245,176,77,.12);color:var(--warn)}
  .tl-row .role{color:var(--tx3);width:52px;flex-shrink:0;font-size:11.5px}
  .tl-row .txt{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-row.marker-row .txt{color:var(--warn);font-family:var(--mono);font-size:11.5px}

  /* ---------- Chat ---------- */
  .chat{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  .chat-h{padding:14px 18px;border-bottom:1px solid var(--line)}
  .chat-h .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px}
  .chat-h .t i{color:var(--brand)}
  .chat-h .live{
    margin-left:auto;font-size:10.5px;color:var(--info);display:flex;align-items:center;gap:5px;
    background:rgba(88,166,255,.1);padding:2px 9px;border-radius:20px;
  }
  .chat-h .live .dot{width:6px;height:6px;border-radius:50%;background:var(--info);animation:blink 1.2s infinite}
  .chat-h .sess{font-size:11px;color:var(--tx3);margin-top:6px;font-family:var(--mono)}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:100%}
  .msg .av{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .msg.user .av{background:rgba(109,124,255,.15);color:var(--brand)}
  .msg.agent .av{background:var(--grad);color:#fff}
  .msg .bd{min-width:0}
  .msg .who{font-size:11px;color:var(--tx3);margin-bottom:4px;display:flex;align-items:center;gap:7px}
  .msg .who .via{background:var(--bg4);padding:1px 7px;border-radius:4px;font-size:10px}
  .msg .bubble{
    background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:12.5px;line-height:1.65;color:var(--tx);
  }
  .msg.user .bubble{background:rgba(109,124,255,.09);border-color:rgba(109,124,255,.25)}
  .msg .bubble code{font-family:var(--mono);font-size:11px;background:#080b11;padding:1px 6px;border-radius:4px;color:#9ecbff}
  .msg .bubble .tool-call{
    display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--brand2);
    background:#0d1017;border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin-top:7px;
  }
  .sysline{
    text-align:center;font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:10px;
  }
  .sysline::before,.sysline::after{content:"";flex:1;height:1px;background:var(--line)}
  .sysline i{color:var(--warn)}
  .chat-input{padding:14px 16px;border-top:1px solid var(--line)}
  .chat-input .box{
    background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  }
  .chat-input .box:focus-within{border-color:var(--brand)}
  .chat-input textarea{
    width:100%;background:transparent;border:none;outline:none;color:var(--tx);resize:none;
    font-size:13px;font-family:inherit;height:44px;line-height:1.5;
  }
  .chat-input textarea::placeholder{color:var(--tx3)}
  .chat-input .bar{display:flex;align-items:center;margin-top:6px}
  .chat-input .tip{font-size:11px;color:var(--tx3)}
  .chat-input .send{
    margin-left:auto;background:var(--grad);border:none;color:#fff;width:30px;height:30px;
    border-radius:8px;cursor:pointer;font-size:12px;
  }
  .chat-disabled{padding:20px 16px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--tx3)}
  .chat-disabled i{display:block;font-size:18px;margin-bottom:8px;color:var(--tx3)}

  .empty-hint{color:var(--tx3);font-size:12.5px;padding:8px 0}
  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">

  <!-- ================= Topbar ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-arrows-turn-to-dots"></i></div>
      AgentHub <small>本地 Session 云端接力</small>
    </div>
    <nav class="nav">
      <a class="active" href="javascript:void(0)"><i class="fa-solid fa-list-check"></i> Handoff 任务</a>
      <a href="javascript:void(0)"><i class="fa-solid fa-cube"></i> Sandbox</a>
      <a href="javascript:void(0)"><i class="fa-solid fa-database"></i> OSS 存储</a>
      <a href="javascript:void(0)"><i class="fa-solid fa-gear"></i> 设置</a>
    </nav>
    <div class="right">
      <div class="conn"><span class="dot"></span> Hub 已连接 · hz-prod</div>
      <button class="icon-btn" title="通知"><i class="fa-regular fa-bell"></i></button>
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
    </div>
  </header>

  <div class="main">
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2><i class="fa-solid fa-clock-rotate-left"></i> Handoff 列表 <span class="count" id="taskCount"></span></h2>
      </div>
      <div class="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="搜索仓库 / 任务…" id="searchInput">
      </div>
      <div class="filters" id="filters">
        <button class="chip active" data-f="all">全部</button>
        <button class="chip" data-f="running">执行中</button>
        <button class="chip" data-f="done">已完成</button>
        <button class="chip" data-f="failed">失败</button>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="sidebar-foot">
        本地推送新任务：<code>agenthub push --task "…"</code>
      </div>
    </aside>

    <!-- ================= Detail ================= -->
    <section class="detail"><div class="detail-inner" id="detail"></div></section>

    <!-- ================= Chat ================= -->
    <aside class="chat" id="chatPanel"></aside>
  </div>
</div>

<script>
/* ====================== Mock 数据 ====================== */
const STATUS_META = {
  running:   {label:'执行中',  cls:'b-running',   icon:'fa-solid fa-circle-notch'},
  done:      {label:'已完成',  cls:'b-done',      icon:'fa-solid fa-check'},
  queued:    {label:'排队中',  cls:'b-queued',    icon:'fa-solid fa-hourglass-half'},
  failed:    {label:'失败',    cls:'b-failed',    icon:'fa-solid fa-xmark'},
  packaging: {label:'打包中',  cls:'b-packaging', icon:'fa-solid fa-box'}
};

const STEPS = [
  {key:'created',      label:'created',      icon:'fa-solid fa-plus'},
  {key:'uploaded',     label:'uploaded',     icon:'fa-solid fa-cloud-arrow-up'},
  {key:'queued',       label:'queued',       icon:'fa-solid fa-hourglass-half'},
  {key:'provisioning', label:'provisioning', icon:'fa-solid fa-cube'},
  {key:'running',      label:'running',      icon:'fa-solid fa-play'},
  {key:'packaging',    label:'packaging',    icon:'fa-solid fa-box'},
  {key:'done',         label:'done',         icon:'fa-solid fa-flag-checkered'}
];

const TASKS = [
  {
    id:'hf-9f3a2c', repo:'payment-gateway', branch:'refactor/order-service',
    summary:'重构 OrderService，拆分状态机逻辑并补齐单元测试',
    status:'running', stepIndex:4,
    session:'sess-c81e3f.jsonl', rounds:23, baseCommit:'a41c9e0',
    pushedAt:'14:02', elapsed:'12m 40s', sandbox:'sb-e2b-7d21 (qwen-code)',
    tokens:'86.4k', inputPkg:'214 MB', outputPkg:'—',
    timeline:{created:'14:02:11',uploaded:'14:02:39',queued:'14:02:40',provisioning:'14:03:05',running:'14:03:52'},

/* ====================== 渲染 ====================== */
let currentId = TASKS[0].id, currentFilter = 'all';
const $ = s => document.querySelector(s);

function renderList(){
  const kw = $('#searchInput').value.trim().toLowerCase();
  const list = TASKS.filter(t =>
    (currentFilter==='all' || t.status===currentFilter) &&
    (!kw || t.repo.toLowerCase().includes(kw) || t.summary.toLowerCase().includes(kw))
  );
  $('#taskCount').textContent = TASKS.length;
  $('#taskList').innerHTML = list.map(t=>{
    const m = STATUS_META[t.status];
    return `<div class="task-item ${t.id===currentId?'active':''}" onclick="selectTask('${t.id}')">
      <div class="row1">
        <span class="repo"><i class="fa-solid fa-folder-tree"></i> ${t.repo}</span>
        <span class="badge ${m.cls}"><i class="${m.icon}"></i>${m.label}</span>
      </div>
      <div class="summary">${t.summary}</div>
      <div class="meta">
        <span><i class="fa-solid fa-code-branch"></i>${t.branch}</span>
        <span><i class="fa-regular fa-comments"></i>${t.rounds} 轮</span>
        <span><i class="fa-regular fa-clock"></i>${t.pushedAt}</span>
      </div>
    </div>`;
  }).join('') || `<div class="empty-hint" style="padding:16px">无匹配任务</div>`;
}

function stepState(t, i){
  if(t.status==='failed') return i < t.stepIndex ? 'done' : (i===t.stepIndex ? 'fail' : '');
  if(i < t.stepIndex) return 'done';
  if(i === t.stepIndex) return t.status==='done' ? 'now st-done' : 'now';
  return '';
}

function renderDetail(){
  const t = TASKS.find(x=>x.id===currentId), m = STATUS_META[t.status];
  const stepper = STEPS.map((s,i)=>{
    const st = stepState(t,i);
    const tm = t.timeline[s.key] || '';
    return `<div class="step ${st}">
        <div class="ic"><i class="${s.icon}"></i></div>
        <div class="lb">${s.label}</div><div class="tm">${tm}</div>
      </div>` + (i<STEPS.length-1?`<div class="step-line ${i<t.stepIndex?'done':''}"></div>`:'');
  }).join('');

  const commits = t.commits.length ? t.commits.map(c=>`
    <div class="commit">
      <span class="hash">${c.hash}</span>
      <div><div class="msg">${c.msg}</div>
        <div class="files">${c.files} · <span class="add">${c.add}</span> <span class="del">${c.del}</span></div></div>
      <span class="who"><i class="fa-solid fa-robot"></i>cloud agent · ${c.time}</span>
    </div>`).join('') : `<div class="empty-hint">云端尚未产生 commit</div>`;

  const logs = t.logs.map(l=>`
    <div class="log-line"><span class="t">${l.t}</span><span class="tag ${l.tag}">[${l.tag.toUpperCase()}]</span><span class="c">${l.c}</span></div>`).join('')
    + (t.status==='running'?`<div class="log-line"><span class="t">&nbsp;</span><span class="tag sys"></span><span class="c"><span class="cursor"></span></span></div>`:'');

  const pullGuide = t.status==='done' ? `
    <div class="card pull-guide">
      <div class="card-h"><i class="fa-solid fa-circle-check"></i> 任务完成 — 拉回本地合并
        <span class="hint">返回包 ${t.outputPkg} · OSS 7 天后自动清理</span></div>
      <div class="card-b">
        <div style="font-size:12.5px;color:var(--tx2);line-height:1.6">在本地仓库目录执行以下命令，AgentHub 将自动完成 <b style="color:var(--tx)">git 代码合并</b> 与 <b style="color:var(--tx)">jsonl 会话时间线合并</b>，之后可在 Qwen Code 中无缝续聊。</div>
        <div class="cmd"><span class="dollar">$</span> agenthub pull ${t.id}
          <span class="copy" title="复制"><i class="fa-regular fa-copy"></i></span></div>
        <div class="merge-note">
          <span class="mi"><i class="fa-solid fa-code-merge"></i> result.bundle → ${t.commits.length} 个 commit 合入 ${t.branch}</span>
          <span class="mi"><i class="fa-solid fa-file-lines"></i> 云端会话增量 → 合并至 ${t.session}</span>
          <span class="mi"><i class="fa-solid fa-shield-halved"></i> 合并前自动备份，可回滚</span>
        </div>
      </div>
    </div>` : '';

  const mergePreview = t.status==='done' ? `
    <div class="card">
      <div class="card-h"><i class="fa-solid fa-timeline"></i> 会话合并预览 <span class="hint">handoff_marker 锚点 · 时间线拼接</span></div>
      <div class="card-b timeline-merge">
        <div class="tl-row"><span class="src local">LOCAL</span><span class="role">user</span><span class="txt">这批 legacy 调用太多了，帮我梳理一份 v1 → v2 的 API 映射表</span></div>
        <div class="tl-row"><span class="src local">LOCAL</span><span class="role">agent</span><span class="txt">已梳理完成：共 213 处调用、涉及 9 类 API，映射关系如下……</span></div>
        <div class="tl-row marker-row"><span class="src marker">MARKER</span><span class="role">system</span><span class="txt">handoff_marker · ${t.id} · base ${t.baseCommit} · 18:35:02</span></div>
        <div class="tl-row"><span class="src cloud">CLOUD</span><span class="role">agent</span><span class="txt">会话已恢复，按映射表开始批量迁移 storage 模块……</span></div>
        <div class="tl-row"><span class="src cloud">CLOUD</span><span class="role">user</span><span class="txt">（Web）迁移完跑一遍全量测试再收尾</span></div>
        <div class="tl-row"><span class="src cloud">CLOUD</span><span class="role">agent</span><span class="txt">全量回归 412 个用例通过，任务收尾，返回包已上传</span></div>
      </div>
    </div>` : '';

  const failCard = t.status==='failed' ? `
    <div class="card" style="border-color:rgba(240,97,109,.35)">
      <div class="card-h"><i class="fa-solid fa-triangle-exclamation" style="color:var(--err)"></i> 失败原因
        <span class="hint">部分成果已打包（${t.outputPkg}）</span></div>
      <div class="card-b" style="font-size:12.5px;color:var(--tx2);line-height:1.7">
        集成测试依赖内网 etcd 集群，Sandbox 网络不可达。已保留 WIP commit 与云端会话记录，
        可执行 <code style="font-family:var(--mono);background:var(--bg3);padding:1px 6px;border-radius:4px;color:var(--tx)">agenthub pull ${t.id}</code>
        取回部分成果，在本地内网环境继续。
      </div>
    </div>` : '';

  $('#detail').innerHTML = `
    <div class="fade-in">
    <div class="d-head">
      <div class="t-icon"><i class="fa-solid fa-arrows-turn-to-dots"></i></div>
      <div>
        <h1>${t.summary}</h1>
        <div class="sub">
          <span><i class="fa-solid fa-folder-tree"></i>${t.repo}</span>
          <span><i class="fa-solid fa-code-branch"></i>${t.branch}</span>
          <span><i class="fa-solid fa-fingerprint"></i><code>${t.id}</code></span>
          <span><i class="fa-solid fa-code-commit"></i>base <code>${t.baseCommit}</code></span>
        </div>
      </div>
      <div class="d-actions">
        ${t.status==='running'||t.status==='queued' ? `<button class="btn danger"><i class="fa-solid fa-ban"></i> 取消</button>`:''}
        ${t.status==='done'||t.status==='failed' ? `<button class="btn primary"><i class="fa-solid fa-download"></i> pull 指引</button>`:''}
        <button class="btn"><i class="fa-solid fa-rotate"></i> 刷新</button>
      </div>
    </div>

    <div class="stepper">${stepper}</div>

    <div class="grid4">
      <div class="stat"><div class="k"><i class="fa-solid fa-cube"></i> Sandbox</div><div class="v" style="font-size:13px;line-height:32px">${t.sandbox}</div></div>
      <div class="stat"><div class="k"><i class="fa-regular fa-clock"></i> 云端执行时长</div><div class="v">${t.elapsed}</div></div>
      <div class="stat"><div class="k"><i class="fa-solid fa-coins"></i> Token 用量</div><div class="v">${t.tokens}</div></div>
      <div class="stat"><div class="k"><i class="fa-solid fa-box-archive"></i> 输入 / 返回包</div><div class="v" style="font-size:14px;line-height:30px">${t.inputPkg} <small>/</small> ${t.outputPkg}</div></div>
    </div>

    ${pullGuide}
    ${failCard}

    <div class="card">
      <div class="card-h"><i class="fa-solid fa-code-commit"></i> 云端产生的 Commit
        <span class="hint">result.bundle 增量 · base ${t.baseCommit}</span></div>
      <div class="card-b">${commits}</div>
    </div>

    <div class="card">
      <div class="card-h"><i class="fa-solid fa-terminal"></i> 执行日志
        <span class="hint">${t.status==='running'?'实时流式回传':'归档日志'}</span></div>
      <div class="logs" id="logBox">${logs}</div>
    </div>

    ${mergePreview}
    </div>`;

  const lb = $('#logBox'); if(lb) lb.scrollTop = lb.scrollHeight;
  renderChat(t);
}

function renderChat(t){
  const canChat = t.status==='running';
  const msgs = t.chat.map(c=>`
    <div class="msg ${c.role} fade-in">
      <div class="av"><i class="fa-solid ${c.role==='user'?'fa-user':'fa-robot'}"></i></div>
      <div class="bd">
        <div class="who">${c.role==='user'?'我':'Cloud Agent'} ${c.via?`<span class="via">via ${c.via}</span>`:''} · ${c.time}</div>
        <div class="bubble">${c.text}${c.tool?`<div class="tool-call"><i class="fa-solid fa-wrench"></i>${c.tool}</div>`:''}</div>
      </div>
    </div>`).join('');

  $('#chatPanel').innerHTML = `
    <div class="chat-h">
      <div class="t"><i class="fa-solid fa-comments"></i> 云端会话
        ${canChat?`<span class="live"><span class="dot"></span>LIVE</span>`:''}</div>
      <div class="sess"><i class="fa-regular fa-file-lines"></i> ${t.session} · 本地 ${t.rounds} 轮已接力</div>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="sysline"><i class="fa-solid fa-flag"></i> handoff_marker · 本地 ${t.rounds} 轮上下文已在云端恢复</div>
      ${msgs || `<div class="empty-hint" style="text-align:center;padding:24px 0">云端会话尚未开始</div>`}
    </div>
    ${canChat ? `
    <div class="chat-input">
      <div class="box">
        <textarea id="chatText" placeholder="向云端 Agent 追加指令，将写入云端 session 并随返回包合并回本地…"></textarea>
        <div class="bar">
          <span class="tip"><i class="fa-solid fa-mobile-screen"></i> 钉钉同步可用 · Enter 发送</span>
          <button class="send" onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>` : `
    <div class="chat-disabled">
      <i class="fa-solid fa-lock"></i>
      ${t.status==='done'?'任务已完成，会话已随返回包归档，pull 后可在本地 Qwen Code 中续聊':
        t.status==='failed'?'任务已终止，会话已归档至返回包':
        '任务尚未进入 running 状态，暂不可对话'}
    </div>`}`;

  const cb = $('#chatBody'); cb.scrollTop = cb.scrollHeight;
  const ta = $('#chatText');
  if(ta) ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
  });
}

/* ====================== 交互 ====================== */
function selectTask(id){ currentId = id; renderList(); renderDetail(); }

function sendChat(){
  const ta = $('#chatText'); if(!ta || !ta.value.trim()) return;
  const t = TASKS.find(x=>x.id===currentId);
  const now = new Date(), hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  t.chat.push({role:'user', via:'Web', text:ta.value.trim(), tool:null, time:hm});
  renderChat(t);
  setTimeout(()=>{
    t.chat.push({role:'agent', via:null, text:'收到指令，已注入当前云端会话。我会在当前步骤完成后处理该请求，并同步写入 session 记录。', tool:null, time:hm});
    renderChat(t);
  }, 900);
}

$('#searchInput').addEventListener('input', renderList);
$('#filters').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  currentFilter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c===b));
  renderList();
});

let liveIdx = 0;
setInterval(()=>{

  const now = new Date();
  const ts = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');

  if(currentId==='hf-9f3a2c') renderDetail();

apiVersion: v1
kind: Namespace
metadata:
  name: agenthub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub-hub
  namespace: agenthub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenthub-hub
  namespace: agenthub
rules:
  - apiGroups: ['']
    resources: [pods, secrets]
    verbs: [get, list, watch, create, delete, update, patch]
  - apiGroups: ['']
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenthub-hub
  namespace: agenthub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agenthub-hub
subjects:
  - kind: ServiceAccount
    name: agenthub-hub
    namespace: agenthub

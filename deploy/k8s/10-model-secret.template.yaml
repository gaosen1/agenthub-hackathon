# 模型凭证 Secret 模板（勿提交真实值；实际执行：
#   kubectl -n agenthub create secret generic agenthub-model \
#     --from-literal=OPENAI_API_KEY=... --from-literal=OPENAI_BASE_URL=... --from-literal=OPENAI_MODEL=...）
apiVersion: v1
kind: Secret
metadata:
  name: agenthub-model
  namespace: agenthub
type: Opaque
stringData:
  OPENAI_API_KEY: REPLACE_ME
  OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  OPENAI_MODEL: qwen3-coder-plus

# NAS 共享层一次性播种 Job：把 code-server 预置到 NAS，供沙箱 Pod 只读挂载后按需拉起。
#
# 使用前替换两处占位符（与 hub-server 的 SANDBOX_NAS_SERVER / SANDBOX_NAS_PATH 一致）：
#   REPLACE_NAS_SERVER → NAS 挂载点地址（如 xxx.nas.aliyuncs.com）
#   REPLACE_NAS_PATH   → NAS 子目录（如 /agenthub）
#
# 目录约定（runner ide.ts 依赖）：<path>/tools/code-server/<version>/ + current 软链
# 升级 code-server：改 CODE_SERVER_VERSION 重跑本 Job，current 软链原子切换。
#
# 真云踩坑（已固化进本清单）：
#   1. ECI/ACS 挂载 NFS 子路径时不会自动创建目录（FailedMount: file does not exist），
#      因此挂 NAS 根目录，由脚本自己 mkdir 子目录；
#   2. 镜像必须用集群可拉的（如 ACR 内的沙箱镜像）；docker.io 与 ACR 里不存在的 tag 都会 ErrImagePull；
#   3. 集群出网可能到不了 GitHub/ghproxy，下载源建议先传 OSS 再用内网签名 URL；
#   4. current 必须用相对软链：消费方挂载点（/mnt/shared）与播种方（/nas）不同，绝对链会断。
apiVersion: batch/v1
kind: Job
metadata:
  name: agenthub-nas-seed
  namespace: agenthub
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector: { type: virtual-kubelet }
      tolerations:
        - { key: virtual-kubelet.io/provider, operator: Exists }
      containers:
        - name: seed
          image: alpine:3.20
          env:
            - { name: CODE_SERVER_VERSION, value: '4.133.0' }
          command: ['sh', '-c']
          args:
            - |
              set -e
              VER="$CODE_SERVER_VERSION"
              DEST=/nas/tools/code-server
              TMP="$DEST/.$VER.tmp"
              mkdir -p "$TMP"
              echo "downloading code-server v$VER ..."
              # 集群出网受限时，先把 tar.gz 传到 OSS bucket，再用内网签名 URL 替换下行地址：
              #   https://<bucket>.oss-<region>-internal.aliyuncs.com/tools/code-server-<ver>.tar.gz?<sig>
              wget -q -O /tmp/cs.tar.gz \
                "https://github.com/coder/code-server/releases/download/v$VER/code-server-$VER-linux-amd64.tar.gz"
              tar -xzf /tmp/cs.tar.gz -C "$TMP" --strip-components=1
              # 原子发布：先落版本目录，再切 current 软链，避免读到半成品
              rm -rf "$DEST/$VER"
              mv "$TMP" "$DEST/$VER"
              # 相对软链：消费方挂载点与播种方不同（/mnt/shared vs /nas），绝对链必断
              ln -sfn "$VER" "$DEST/current"
              "$DEST/current/bin/code-server" --version
              echo "seeded: $DEST/current -> $DEST/$VER"
          volumeMounts:
            - { name: nas, mountPath: /nas }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
      volumes:
        - name: nas
          nfs:
            server: REPLACE_NAS_SERVER
            path: REPLACE_NAS_PATH
